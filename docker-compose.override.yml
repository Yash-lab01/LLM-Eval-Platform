# Local Development Overrides
# Automatically loaded by `docker compose up` in local dev environments.
services:
  api:
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
      - ./mcp:/app/mcp

  mcp:
    volumes:
      - ./backend:/app/backend
      - ./mcp:/app/mcp

  worker:
    volumes:
      - ./backend:/app/backend
      - ./mcp:/app/mcp
